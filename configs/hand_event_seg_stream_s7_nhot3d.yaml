# EventStreamSegS7 on N-HOT3D (Aria egocentric hand segmentation).
# ---------------------------------------------------------------------------------------
# Port of hand_event_seg_stream_s7.yaml to the N-HOT3D per-event sparse loader
# (NHOT3DEventDataset). S7 reads the SAME SparseEventBatch as EventSSMSegStream
# (hand_event_seg_nhot3d_ssm_stream.yaml, the grid-SSM baseline on this data), so this is a
# drop-in DATA swap — model/loss/eval are unchanged. Smoke-test the model first:
#   EventBasedObjectDetection/bin/python tools/smoke_test_event_stream_s7.py
#
# FAST PROFILE (~7-14x faster, pure torch) once accuracy is confirmed on N-HOT3D: set
#   model_init_args.use_complex: False + dual_scan: False + use_checkpoint: False
# (real-diagonal SSM + drop the inert dual scan; see hand_event_seg_stream_s7_fast.yaml and
# the profiler tools/profile_s7_step.py). Kept OFF here so a first run isolates "does S7
# learn on N-HOT3D" from "does real-diagonal hold accuracy".

TRAINING:
  deterministic: False
  use_compile: False
  inference_mode: False
  seed: 42
  max_epochs: 50
  num_sanity_val_steps: 0
  task: event_segmentation
  # LOSS: same recipe as the S7 hand config (GJS + per-sample Lovász; BCE off, pos_weight 2).
  event_loss_config:
    bce_weight: 0.0
    pos_weight: 2.0
    gjs_weight: 1.0
    gjs_pi1: 0.5
    lovasz_weight: 1.0
  event_eval_config:
    thr_min: 0.05
    thr_max: 0.95
    thr_steps: 19
    clean_enabled: True
    clean_open_ksize: 3
    clean_keep_largest: False
    clean_min_area: 0
  val_preview_count: 8

DISTRIBUTED:
  accelerator: gpu
  devices: 4
  num_nodes: 1
  strategy: auto

DATA:
  dataset:
    file_name: nhot3d_event_dataset
    class_name: NHOT3DEventDataset
    dataset_init_args:
      # root = the Aria/ dir holding train/ valid/ test/. ``purpose`` (injected by
      # DataInterface) picks the split — no LOSO/held_out here (splits are on disk).
      root_dir: /fs/nexus-projects/DVS_Actions/N-HOT3D/Aria
      image_height: 512
      image_width: 512
      event_height: 260           # native event sensor; rescaled to image_* per axis
      event_width: 346
      frames_per_sample: 1        # 1 event chunk (~33 ms @30fps) per sample
      max_events: 30000           # per-event scan cost ~linear in N (was 150k for the grid SSM,
                                  #   whose cost is event-count-independent). Raise if 33ms windows
                                  #   are denser than ~30k and recall suffers.
      require_mask: True
      boundary_ignore_px: 0
      time_ignore_frac: 0.0
      # Event-native augmentation + Fix-A no-hand negatives. All transforms operate on
      # raw events and carry each per-event label, so they are dataset-agnostic.
      augmentation:
        enabled: True
        hflip_prob: 0.5
        vflip_prob: 0.0
        affine_prob: 0.6
        rotate_deg: 20.0
        scale_range: [0.75, 1.35]
        translate_frac: 0.15
        jitter_px: 1.5
        event_drop_prob: 0.6
        event_drop_frac: [0.0, 0.6]
        upsample_prob: 0.3
        upsample_range: [1.0, 1.6]
        area_drop_prob: 0.35
        area_drop_frac: 0.22
        area_drop_count: 2
        time_crop_prob: 0.35
        time_crop_min: 0.6
        time_reverse_prob: 0.2
        polarity_flip_prob: 0.1
        time_jitter: 0.015
        noise_frac: 0.10
        min_events: 64
        hand_drop_prob: 0.20
        hand_drop_dilate_px: 0
      num_classes: 1
  dataloader:
    batch_size: 4                 # per-event scan is memory-heavy (was 8 for the grid SSM); 4 + grad-accum.
    test_batch_size: 4
    num_workers: 8
    persistent_workers: True
    pin_memory: True
    multiprocessing_context: forkserver   # NOT fork: fork-after-CUDA deadlocks the DDP VAL dataloader.
    drop_last: True
    shuffle_train: True
    shuffle_val: False
    shuffle_test: False

MODEL:
  file_name: event_stream_seg_s7
  class_name: EventStreamSegS7
  model_init_args:
    in_features: 2                      # (polarity, t_norm); geom/motion/density/subcell/fourier synthesized in-model
    embed_dim: 128
    d_state: 64
    ssm_layers: 2
    use_complex: True                   # FAST: set False (real-diagonal) — see header. Kept True (accuracy-safe).
    dual_scan: True                     # FAST: set False (drop the inert z-order scan) — see header.
    morton_bits: 10
    time_blocks: 6
    fourier_bands: 8
    down_factor: 8                      # 512/8 = 64-cell context grid. 4 = sharper (128) if memory allows.
    context_channels: 128
    context_depth: 2
    head_hidden: 128
    num_classes: 1
    coord_mode: relative                # centroid-relative geometry (no subject-location leak)
    motion_features: True
    motion_radius: 3
    motion_dir: False
    motion_min_count: 6
    density_features: True
    density_radius: 2
    dropout: 0.2
    dmd_gate: True
    dmd_gate_scale: 1.0
    presence_gate: True
    presence_gate_weight: 0.3
    presence_gate_scale: 1.0
    presence_min_fg: 0
    aux_shape_head: True
    aux_grid: 32
    aux_shape_weight: 0.2
    null_loss_weight: 0.0
    null_margin: 1.0
    scan_weight: 0.1                    # dual-scan consistency (ignored when dual_scan: False)
    boundary_loss_weight: 1.0
    boundary_loss_band: 0
    event_pool: 1
    use_checkpoint: True                # FAST: set False when memory-light (real+no_dual) — see header.
    gn_groups: 8

OPTIMIZER:
  name: AdamW
  arguments:
    lr: 3e-4
    weight_decay: 1e-4
  gradient_accumulation:
    enabled: True
    scheduling: {0: 4, 4: 2, 8: 1}
  gradient_clip:
    enabled: True
    gradient_clip_val: 1.0
    gradient_clip_algorithm: norm
  stochastic_weight_averaging:
    enabled: True
    swa_lrs: 1e-4

SCHEDULER:
  learning_rate:
    enabled: True
    name: CosineAnnealingLR
    arguments:
      T_max: 50
      eta_min: 1e-6
  early_stopping:
    enabled: False
    monitor: val_loss_epoch
    mode: min
    patience: 5
    min_delta: 1e-5

LOGGER:
  log_dir_root: lightning_logs
  experiment_name: hand_event_seg_stream_s7_nhot3d

CHECKPOINT:
  enabled: True
  every_n_epochs: 1
  monitor: val_event_f1_epoch
  mode: max
  filename: "best-{epoch:03d}-{val_event_f1_epoch:.4f}"
  save_top_k: 1
  save_last: True
