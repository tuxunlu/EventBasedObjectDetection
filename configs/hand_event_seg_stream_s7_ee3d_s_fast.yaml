# EventStreamSegS7 on EventEgo3D++ / EE3D-S — FAST variant (SAFE speedups only).
# ---------------------------------------------------------------------------------------
# Identical to hand_event_seg_stream_s7_ee3d_s.yaml EXCEPT two SPEED toggles that carry
# ~zero accuracy risk (the complex SSM is KEPT — this is NOT the real-diagonal R1 gate):
#   * dual_scan:     True -> False   # the bidirectional z-order scan is MEASURED inert
#                                    #   (scan_loss ~= 0); dropping it is ~2.8x on its own.
#   * use_checkpoint True -> False   # gradient-checkpoint OFF = MATHEMATICALLY IDENTICAL
#                                    #   forward/backward, just trades memory for ~1.3x.
# Measured on the profiler (tools/profile_s7_step.py, 30k ev / B4 / L40S, fwd+bwd):
#   full 770ms -> no_dual 273ms (2.8x); no_checkpoint frees another ~169ms.
# Net expectation vs the base ee3d_s config: ~2 it/s -> ~6 it/s (~45 min/epoch instead of
# ~2.7 h). EE3D-S frames are ~17k events so batch 4 + checkpoint-OFF should fit the 48GB
# L40S, but checkpoint-OFF uses MORE memory:
#   OOM FALLBACK -> set use_checkpoint back to True (keeps the 2.8x from dual_scan alone),
#                   or lower dataloader.batch_size to 2.
#
# For the FULL ~7.2x you must ALSO set use_complex: False — but that is the UNVALIDATED
# real-diagonal ablation (hand_event_seg_stream_s7_real.yaml / the R1 gate). Do NOT commit
# a multi-day run to it blind; run it matched ~8 epochs and confirm val_event_f1 first.
#
# FISHEYE: geometric augmentation stays OFF (invalid on fisheye). EE3D-S is SYNTHETIC
# egocentric PERSON (full-body) segmentation; masks are INVERTED (person=dark).

TRAINING:
  deterministic: False
  use_compile: False
  inference_mode: False
  seed: 42
  max_epochs: 50
  num_sanity_val_steps: 0
  task: event_segmentation
  event_loss_config:
    bce_weight: 0.0
    pos_weight: 2.0                    # person fg is larger than hand; pos_weight can be lowered to ~1.
    gjs_weight: 1.0
    gjs_pi1: 0.5
    lovasz_weight: 1.0
  event_eval_config:
    thr_min: 0.05
    thr_max: 0.95
    thr_steps: 19
    clean_enabled: True
    clean_open_ksize: 3
    clean_keep_largest: False
    clean_min_area: 0
  val_preview_count: 8

DISTRIBUTED:
  accelerator: gpu
  devices: 4
  num_nodes: 1
  strategy: auto

DATA:
  dataset:
    file_name: ee3d_event_dataset
    class_name: EE3DEventStreamDataset
    dataset_init_args:
      root_dir: /fs/nexus-projects/DVS_Encodings/EE3D-S
      split_dir: configs/ee3d_s_splits   # subject-disjoint train/val/test (authors ship EE3D-S train-only)
      skip_missing_units: True           # 860 units copied incrementally -> skip the not-yet-present ones
      mask_layout: pose                  # EE3D-S: <pose>/<frame>/Segmentation/<jpg>
      mask_person_is_dark: True          # inverted render: person = black silhouette on white
      mask_binarize_thresh: 128          # person = gray < 128 (preview / rasterized-IoU only)
      image_height: 480
      image_width: 640
      max_events: 30000            # per-event scan cost ~linear in N (was 150k). EE3D-S ~17k/frame.
      include_unlabeled: True      # keep out-of-view frames as background negatives (free per-event labels)
      num_classes: 1
      augmentation:
        enabled: False             # FISHEYE: geometric augs invalid. Leave OFF.
  dataloader:
    batch_size: 4                  # per-event scan is memory-heavy (was 8 for sparse-conv); 4 + grad-accum.
    test_batch_size: 4
    num_workers: 8
    persistent_workers: True
    pin_memory: True               # SparseEventBatch implements pin_memory()
    multiprocessing_context: forkserver   # EE3D dataset __getstate__ drops h5 handles -> picklable/safe.
    drop_last: True
    shuffle_train: True
    shuffle_val: False
    shuffle_test: False

MODEL:
  file_name: event_stream_seg_s7
  class_name: EventStreamSegS7
  model_init_args:
    in_features: 2                      # = EE3DEventStreamDataset.NUM_FEATURES (signed pol, t_norm)
    embed_dim: 128
    d_state: 64
    ssm_layers: 2
    use_complex: True                   # KEPT True: complex SSM unchanged -> accuracy matches base profile.
                                        #   Set False ONLY as the R1 real-diagonal ablation (full 7.2x, unvalidated).
    dual_scan: False                    # FAST: z-order scan is measured inert (scan_loss ~= 0) -> ~2.8x.
    morton_bits: 10
    time_blocks: 6
    fourier_bands: 8
    down_factor: 8                      # 480x640 /8 = 60x80 context grid. 4 = sharper if memory allows.
    context_channels: 128
    context_depth: 2
    head_hidden: 128
    num_classes: 1
    coord_mode: relative
    motion_features: True               # plane-fit flow is only locally-approximate on fisheye but still informative
    motion_radius: 3
    motion_dir: False
    motion_min_count: 6
    density_features: True
    density_radius: 2
    dropout: 0.2
    dmd_gate: True
    dmd_gate_scale: 1.0
    presence_gate: True                 # per-window "person present?" gate (helps the no-person frames)
    presence_gate_weight: 0.3
    presence_gate_scale: 1.0
    presence_min_fg: 0
    aux_shape_head: True
    aux_grid: 32
    aux_shape_weight: 0.2
    null_loss_weight: 0.0
    null_margin: 1.0
    scan_weight: 0.1                    # dual-scan consistency (ignored now that dual_scan: False)
    boundary_loss_weight: 1.0
    boundary_loss_band: 0
    event_pool: 1
    use_checkpoint: False               # FAST: identical math, more memory. OOM -> set True (keeps 2.8x) or batch 2.
    gn_groups: 8

OPTIMIZER:
  name: AdamW
  arguments:
    lr: 3e-4
    weight_decay: 1e-4
  gradient_accumulation:
    enabled: True
    scheduling: {0: 4, 4: 2, 8: 1}
  gradient_clip:
    enabled: True
    gradient_clip_val: 1.0
    gradient_clip_algorithm: norm
  stochastic_weight_averaging:
    enabled: True
    swa_lrs: 1e-4

SCHEDULER:
  learning_rate:
    enabled: True
    name: CosineAnnealingLR
    arguments:
      T_max: 50
      eta_min: 1e-6
  early_stopping:
    enabled: False
    monitor: val_loss_epoch
    mode: min
    patience: 5
    min_delta: 1e-5

LOGGER:
  log_dir_root: lightning_logs
  experiment_name: hand_event_seg_stream_s7_ee3d_s_fast

CHECKPOINT:
  enabled: True
  every_n_epochs: 1
  monitor: val_event_f1_epoch
  mode: max
  filename: "best-{epoch:03d}-{val_event_f1_epoch:.4f}"
  save_top_k: 1
  save_last: True
